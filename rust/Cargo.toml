[package]
name = "video-indiren"
version = "2.0.3"
description = "Video Indiren - Desktop video downloader powered by yt-dlp and FFmpeg"
edition = "2021"

[[bin]]
name = "VideoIndiren"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
rfd = "0.15"
dirs = "6"
chrono = "0.4"
